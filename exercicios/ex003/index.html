<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale= 1.0">
        <link rel="shortcut icon" href="favicon.ico.png" type="image/x-icon">
        <title>Imagens</title>
    </head>
    <body>
        <h1>Testando carga de imagens</h1>
        <p>Abaixo você vai ver uma imagem que está na mesma pasta.</p>
        <img src="logo-html.png" alt="Logo do HTML5">
        <p>Podemos também carregar imagens que estão em outra pasta, contanto que ela esteja dentro da pasta atual.</p>
        <img src="fotos/logo-css.png" alt="Logo das CSS">
        <p>Também podemos carregar imagens externas, e para isso devemos ter sua URL completa.</p>
        <img src="https://e7.pngegg.com/pngimages/640/199/png-clipart-javascript-logo-html-javascript-logo-angle-text-thumbnail.png" alt="Logo de JavaScript">
    </body>
</html>
