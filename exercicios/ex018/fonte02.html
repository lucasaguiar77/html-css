<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes externas</title>
    <style>
        @font-face {
            font-family: 'magic';
            src: url('The Magic Castle.ttf') format('truetype');
        }
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        h1{
            font-family: 'magic', Arial, Helvetica, sans-serif ;
            font-size: 3em;
        }
    </style>
</head>
<body>
    <h1>Título</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Porro, minima error. Voluptate, maiores similique libero illo suscipit minus alias at corrupti quas accusamus aspernatur. Dolore magni maxime sit molestiae tempora.</p>
</body>
</html>
